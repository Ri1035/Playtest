<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POP ISLAND · 波普小岛</title>
<meta name="description" content="一款以波普艺术为视觉语言的 2D 小岛经营游戏，Ben-Day 网点与漫画拟声词全程在线。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23ffd400'/><circle cx='16' cy='16' r='9' fill='%23ff2d78'/></svg>">
</head>
<body>
<div class="app">

  <header class="masthead">
    <h1 class="logo"><span class="logo-pop">POP</span><span class="logo-island">ISLAND</span></h1>
    <p class="tagline">印刷出来的岛屿 · 网点与拟声词</p>
  </header>

  <section class="hud" aria-label="资源状态">
    <div class="res-card res-wood"><span class="res-icon">🪵</span><span class="res-label">木材</span><span class="res-value" id="res-wood">0</span></div>
    <div class="res-card res-stone"><span class="res-icon">🪨</span><span class="res-label">石料</span><span class="res-value" id="res-stone">0</span></div>
    <div class="res-card res-crystal"><span class="res-icon">💎</span><span class="res-label">晶石</span><span class="res-value" id="res-crystal">0</span></div>
    <div class="stat"><span class="stat-label">人口</span><span class="stat-value" id="stat-pop">1</span></div>
    <div class="stat"><span class="stat-label">建筑</span><span class="stat-value" id="stat-buildings">0</span></div>
    <div class="stat"><span class="stat-label">连击</span><span class="stat-value" id="stat-combo">-</span></div>
  </section>

  <main class="stage">
    <canvas id="board" aria-label="波普小岛游戏画面"></canvas>
  </main>

  <p class="hint" id="hint" role="status" aria-live="polite">欢迎登岛！</p>

  <section class="toolbar-wrap" aria-label="建造工具栏">
    <h2 class="toolbar-title">建造</h2>
    <div class="toolbar" id="toolbar"></div>
  </section>

  <footer class="foot">
    <button type="button" id="btn-sound" class="ghost-btn">🔊 音效开</button>
    <button type="button" id="btn-reset" class="ghost-btn">🏝️ 换一座岛</button>
    <span class="credit">波普小岛 · 纯 Canvas 绘制</span>
  </footer>

</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
